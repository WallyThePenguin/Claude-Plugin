std = "roblox"

exclude = [
	# Forest-installed dependency trees. Vendored third-party code: not ours to lint, and
	# the findings are pure noise that would train us to ignore lint output. `forest
	# install` owns these directories.
	"**/Packages/**",

	# Superseded game banks (place1 wave-survival, NEON GAUNTLET), kept for provenance
	# only. Not built, not shipped, not maintained.
	"game/archive/**",
]
