# CLIProxyAPI config for the local Studio Agent model proxy.
# Structure mirrors the verified-working TemporalRift proxy on this machine (same image,
# same Claude subscription). Copy to config.yaml (gitignored) via gen-key.ps1, which
# injects the real inbound key.

# Bind all interfaces INSIDE the container; loopback is enforced by the compose port map.
host: "0.0.0.0"
port: 8317

# The subscription OAuth token (from `-claude-login`) persists in the cliproxy-auth volume
# mounted at this path. NOT in this file, NOT in the image.
auth-dir: "/data/cli-proxy-api"

# Inbound auth: the ONLY key a caller (the plugin) presents, as `Authorization: Bearer <key>`.
# Low-value LOCAL access key — NOT the subscription token. gen-key.ps1 replaces the placeholder.
api-keys:
  - "REPLACE_WITH_HEX_INBOUND_KEY"

# Provider routing. Present in the working reference; a minimal config WITHOUT this returns
# "unknown provider for model" on /v1/messages even though /v1/models lists the model.
routing:
  strategy: round-robin
  session-affinity: true
  session-affinity-ttl: 3600

request-retry: 3
max-retry-interval: 30

# On subscription rolling-window limits, prefer switching rather than hard-failing.
quota-exceeded:
  switch-project: true
  switch-preview-model: true

# Management / control panel off (a local single-user proxy doesn't need it).
remote-management:
  allow-remote: false
  secret-key: ""
  disable-control-panel: true

# Log to stdout (docker logs); never to the container disk.
logging-to-file: false
debug: false
